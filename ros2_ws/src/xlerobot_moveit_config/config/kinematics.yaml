# The SO-101 arms have five actuated arm joints. Position-only IK deliberately
# leaves orientation underconstrained; the pregrasp backend tries explicit
# wrist-roll seeds rather than pretending this is a six-DOF arm.
right_arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 2.0
  position_only_ik: true

left_arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 2.0
  position_only_ik: true

head:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 1.0
