controller_manager:
  ros__parameters:
    update_rate: 50
    enforce_command_limits: true
    # Shared serial-bus reads normally take about 1.3-2.2 ms on the reference
    # robot.  The controller_manager defaults (1 ms warn / 2 ms error) describe
    # memory-backed hardware and falsely mark healthy buses as failed.  These
    # microsecond thresholds remain comfortably below the 20 ms control period.
    diagnostics.threshold.hardware_components.execution_time.mean_error.warn: 5000.0
    diagnostics.threshold.hardware_components.execution_time.mean_error.error: 12000.0
    diagnostics.threshold.hardware_components.execution_time.standard_deviation.warn: 1000.0
    diagnostics.threshold.hardware_components.execution_time.standard_deviation.error: 5000.0
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    base_controller:
      type: diff_drive_controller/DiffDriveController
    right_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    right_gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    left_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    left_gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    head_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    right_policy_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_state_broadcaster:
  ros__parameters:
    publish_rate: 50.0

base_controller:
  ros__parameters:
    left_wheel_names: [left_wheel_joint]
    right_wheel_names: [right_wheel_joint]
    wheel_separation: 0.52
    wheel_radius: 0.0635
    open_loop: false
    position_feedback: true
    cmd_vel_timeout: 0.5
    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_link
    enable_odom_tf: true
    publish_limited_velocity: true
    linear.x.has_velocity_limits: true
    linear.x.max_velocity: 0.15
    linear.x.min_velocity: -0.15
    angular.z.has_velocity_limits: true
    angular.z.max_velocity: 0.6
    angular.z.min_velocity: -0.6

right_arm_controller:
  ros__parameters:
    set_last_command_interface_value_as_state_on_activation: false
    interpolate_from_desired_state: false
    joints:
      - right_arm_shoulder_pan
      - right_arm_shoulder_lift
      - right_arm_elbow_flex
      - right_arm_wrist_flex
      - right_arm_wrist_roll
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_partial_joints_goal: false
    open_loop_control: false

right_gripper_controller:
  ros__parameters:
    set_last_command_interface_value_as_state_on_activation: false
    interpolate_from_desired_state: false
    joints: [right_arm_gripper]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_partial_joints_goal: false
    open_loop_control: false

left_arm_controller:
  ros__parameters:
    joints:
      - left_arm_shoulder_pan
      - left_arm_shoulder_lift
      - left_arm_elbow_flex
      - left_arm_wrist_flex
      - left_arm_wrist_roll
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_partial_joints_goal: false
    open_loop_control: false

left_gripper_controller:
  ros__parameters:
    joints: [left_arm_gripper]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_partial_joints_goal: false
    open_loop_control: false

head_controller:
  ros__parameters:
    joints: [head_pan_joint, head_tilt_joint]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_partial_joints_goal: false
    open_loop_control: false

right_policy_controller:
  ros__parameters:
    joints:
      - right_arm_shoulder_pan
      - right_arm_shoulder_lift
      - right_arm_elbow_flex
      - right_arm_wrist_flex
      - right_arm_wrist_roll
      - right_arm_gripper
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_partial_joints_goal: false
    open_loop_control: false
