/leader/controller_manager:
  ros__parameters:
    update_rate: 50
    enforce_command_limits: true
    # Six-servo synchronous USB/serial reads take ~1.37 ms on the reference
    # Leader. Jazzy measures synchronous execution mean against zero; its
    # generic 1 ms warning therefore fires even with a stable 50 Hz loop.
    # Budget 10% / 20% of the 20 ms period for mean I/O time. Keep the original
    # 100 / 200 us jitter thresholds and all periodicity/deadline checks.
    diagnostics.threshold.hardware_components.execution_time.mean_error.warn: 2000.0
    diagnostics.threshold.hardware_components.execution_time.mean_error.error: 4000.0
    diagnostics.threshold.hardware_components.execution_time.standard_deviation.warn: 100.0
    diagnostics.threshold.hardware_components.execution_time.standard_deviation.error: 200.0
    leader_joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    leader_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    leader_torque_controller:
      type: xlerobot_leader_teleop/LeaderTorqueController

/leader/leader_arm_controller:
  ros__parameters:
    joints: [leader_shoulder_pan, leader_shoulder_lift, leader_elbow_flex, leader_wrist_flex, leader_wrist_roll, leader_gripper]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_partial_joints_goal: false
    # Every preparation starts from measured pose, never the previous episode.
    set_last_command_interface_value_as_state_on_activation: false
    interpolate_from_desired_state: false

/leader/leader_torque_controller:
  ros__parameters:
    enable_lease_s: 1.0
