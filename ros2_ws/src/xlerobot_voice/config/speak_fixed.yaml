speak_text_server:
  ros__parameters:
    backend_enabled: false
    backend: preset
    voice_id: zh-CN-XiaoxiaoNeural
    audio_player_argv: [paplay, '--device=low-latency0', '--latency-msec=200']
    audio_player_device: ''
    audio_predecode_pcm: false
    validate_preset_pcm: true
    preset_directory: ''
    preset_texts:
      - 我在，请说。
      - 好的，我去拿。
      - 没听清，请再说一次。
      - 任务完成。
      - 任务失败，请查看页面。
      - 任务已取消。
    preset_files:
      - fixed_wake.wav
      - fixed_accepted.wav
      - fixed_retry.wav
      - fixed_complete.wav
      - fixed_failed.wav
      - fixed_canceled.wav
    timeout_s: 10.0
