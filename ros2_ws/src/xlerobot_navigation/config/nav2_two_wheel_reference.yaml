amcl:
  ros__parameters:
    alpha1: 0.08
    alpha2: 0.08
    alpha3: 0.08
    alpha4: 0.08
    alpha5: 0.10
    base_frame_id: base_link
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: map
    lambda_short: 0.1
    laser_likelihood_max_dist: 1.0
    laser_max_range: 8.0
    laser_min_range: 0.05
    laser_model_type: likelihood_field
    max_beams: 120
    max_particles: 6000
    min_particles: 1000
    odom_frame_id: odom
    pf_err: 0.03
    pf_z: 0.99
    recovery_alpha_fast: 0.1
    recovery_alpha_slow: 0.001
    resample_interval: 1
    robot_model_type: nav2_amcl::DifferentialMotionModel
    save_pose_rate: 0.5
    sigma_hit: 0.12
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.05
    update_min_d: 0.10
    z_hit: 0.75
    z_max: 0.05
    z_rand: 0.15
    z_short: 0.05
    scan_topic: scan

map_server:
  ros__parameters:
    topic_name: map
    frame_id: map

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    # The controller server can need more than Nav2's 20 ms default while a
    # freshly activated costmap and controller are processing a new path.
    default_server_timeout: 500
    wait_for_service_timeout: 5000
    action_server_result_timeout: 900.0
    navigators: [navigate_to_pose, navigate_through_poses]
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    navigate_through_poses:
      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator
    error_code_names: [compute_path_error_code, follow_path_error_code]

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.10
      movement_time_allowance: 10.0
    general_goal_checker:
      stateful: true
      plugin: nav2_controller::SimpleGoalChecker
      # Nav2 owns position only. Spin and local docking own target yaw.
      xy_goal_tolerance: 0.04
      yaw_goal_tolerance: 3.15
    FollowPath:
      plugin: nav2_rotation_shim_controller::RotationShimController
      angular_dist_threshold: 0.785
      angular_disengage_threshold: 0.3925
      forward_sampling_distance: 0.35
      rotate_to_heading_angular_vel: 0.25
      max_angular_accel: 0.45
      max_cost_threshold: 254.0
      simulate_ahead_time: 1.0
      rotate_to_goal_heading: false
      rotate_to_heading_once: false
      closed_loop: true
      use_path_orientations: false
      primary_controller: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.15
      lookahead_dist: 0.35
      min_lookahead_dist: 0.20
      max_lookahead_dist: 0.60
      lookahead_time: 1.5
      transform_tolerance: 0.2
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.04
      approach_velocity_scaling_dist: 0.45
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 0.45
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.45
      regulated_linear_scaling_min_speed: 0.04
      cost_scaling_dist: 0.25
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 5.0
      use_rotate_to_heading: false
      allow_reversing: false
      rotate_to_heading_min_angle: 0.50
      max_robot_pose_search_dist: 2.0
      use_interpolation: true
      use_cancel_deceleration: true
      cancel_deceleration: 0.4
      stateful: true
      prune_distance: 1.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      # Reference ready/carry envelope, slightly tighter than the original
      # 0.55 m wide reference rectangle; collision_monitor still uses this footprint.
      footprint: "[[-0.221, -0.275], [-0.221, 0.275], [0.230, 0.275], [0.230, -0.275]]"
      footprint_padding: 0.005
      plugins: [voxel_layer, inflation_layer]
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 10.0
        inflation_radius: 0.22
      voxel_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        enabled: true
        publish_voxel_map: true
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      # Local obstacle response remains at 5 Hz; keep global replanning at the
      # planner's 1 Hz cadence to avoid unnecessary full-map churn.
      update_frequency: 1.0
      publish_frequency: 1.0
      initial_transform_timeout: 600.0
      global_frame: map
      robot_base_frame: base_link
      footprint: "[[-0.221, -0.275], [-0.221, 0.275], [0.230, 0.275], [0.230, -0.275]]"
      footprint_padding: 0.005
      resolution: 0.05
      track_unknown_space: true
      plugins: [static_layer, obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 5.0
        inflation_radius: 0.30
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    planner_plugins: [GridBased]
    costmap_update_timeout: 1.0
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.05
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    smoother_plugins: [smoothPath]
    smoothPath:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [spin, backup, drive_on_heading, assisted_teleop, wait]
    spin:
      plugin: nav2_behaviors::Spin
    backup:
      plugin: nav2_behaviors::BackUp
    drive_on_heading:
      plugin: nav2_behaviors::DriveOnHeading
    wait:
      plugin: nav2_behaviors::Wait
    assisted_teleop:
      plugin: nav2_behaviors::AssistedTeleop
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 0.25
    max_rotational_vel: 0.35
    min_rotational_vel: 0.08
    rotational_acc_lim: 0.6

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    stamp_smoothed_velocity_with_smoothing_time: false
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity: [0.15, 0.0, 0.35]
    min_velocity: [-0.08, 0.0, -0.35]
    max_accel: [0.5, 0.0, 1.0]
    max_decel: [-0.5, 0.0, -1.0]
    odom_topic: odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

collision_monitor:
  ros__parameters:
    base_frame_id: base_link
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel_smoothed
    # The only Nav2 topic allowed to enter drive_safety.
    cmd_vel_out_topic: cmd_vel_nav
    state_topic: collision_monitor_state
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    polygons: [FootprintApproach]
    FootprintApproach:
      type: polygon
      action_type: approach
      footprint_topic: /local_costmap/published_footprint
      time_before_collision: 0.45
      simulation_time_step: 0.1
      min_points: 6
      visualize: false
      enabled: true
    observation_sources: [scan]
    scan:
      type: scan
      topic: scan
      min_height: 0.15
      max_height: 2.0
      enabled: true
