approach_target_server:
  ros__parameters:
    execution_enabled: false
    map_frame: map
    base_frame: base_link
    min_standoff_m: 0.4
    max_standoff_m: 1.5
    fallback_standoff_m: [0.7, 1.0]
    min_target_separation_m: 0.05
    max_target_distance_m: 8.0
    tf_timeout_s: 1.0
    server_timeout_s: 5.0
    path_timeout_s: 8.0
    # Do not cancel Nav2 just as its 10 s progress recovery starts moving.
    nav_attempt_timeout_s: 30.0
    backup_distance_m: 0.20
    backup_speed_mps: 0.08
    backup_timeout_s: 5.0
    nav_timeout_s: 125.0
    path_action: /compute_path_to_pose
    nav_action: /navigate_to_pose
    backup_action: /backup
