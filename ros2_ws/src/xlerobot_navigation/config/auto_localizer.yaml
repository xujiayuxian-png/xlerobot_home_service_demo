auto_localizer_server:
  ros__parameters:
    # Standalone launches remain disabled; the canonical hardware demo enables requests.
    execution_enabled: false
    max_revolutions: 2.5
    max_duration_s: 60.0
    spin_direction: 1.0
    service_timeout_s: 3.0
    server_timeout_s: 8.0
    control_rate_hz: 20.0
    settle_timeout_s: 5.0
    settle_hold_s: 0.75
    settle_angular_speed_radps: 0.03
    amcl_pose_timeout_s: 1.0
    odom_topic: odom
    amcl_pose_topic: amcl_pose
    global_localization_service: /reinitialize_global_localization
    spin_action_name: spin
    action_name: auto_localize
    activate_navigation_after_localization: false
    navigation_lifecycle_manager: /lifecycle_manager_navigation
    navigation_startup_timeout_s: 15.0
    convergence.min_rotation_rad: 3.14
    convergence.position_stddev_m: 0.15
    convergence.yaw_stddev_rad: 0.10
    convergence.hold_s: 1.0
